<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <clipPath id="disc"><circle cx="128" cy="128" r="120"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1622"/>
      <stop offset="1" stop-color="#13324a"/>
    </linearGradient>
    <radialGradient id="lbg" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#13324a"/>
      <stop offset="1" stop-color="#0a1622"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <!-- faint grid of range rings on the right -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="2">
    <circle cx="1080" cy="150" r="60"/><circle cx="1080" cy="150" r="120"/><circle cx="1080" cy="150" r="180"/>
  </g>
  <!-- logo -->
  <g transform="translate(40 22) scale(1.0)">
    <circle cx="128" cy="128" r="124" fill="url(#lbg)" stroke="#22d3ee" stroke-width="4"/>
    <g fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2">
      <circle cx="128" cy="128" r="90"/><circle cx="128" cy="128" r="58"/><circle cx="128" cy="128" r="26"/>
      <line x1="128" y1="10" x2="128" y2="246"/><line x1="10" y1="128" x2="246" y2="128"/>
    </g>
    <path d="M128 128 L218 128 A90 90 0 0 0 191.6 64.4 Z" fill="url(#sweep)"/>
    <g fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" clip-path="url(#disc)">
      <path d="M58 198 A26 26 0 0 1 84 172"/>
      <path d="M58 216 A44 44 0 0 1 102 172" stroke-opacity="0.75"/>
      <path d="M58 234 A62 62 0 0 1 120 172" stroke-opacity="0.45"/>
    </g>
    <circle cx="58" cy="198" r="7" fill="#f59e0b"/>
    <g transform="translate(176 86)" fill="#e5e7eb">
      <rect x="-9" y="-6" width="18" height="12" rx="4"/>
      <g stroke="#e5e7eb" stroke-width="3.5" stroke-linecap="round">
        <line x1="-6" y1="-4" x2="-19" y2="-15"/><line x1="6" y1="-4" x2="19" y2="-15"/>
        <line x1="-6" y1="4" x2="-19" y2="15"/><line x1="6" y1="4" x2="19" y2="15"/>
      </g>
      <g fill="none" stroke="#e5e7eb" stroke-width="2.5">
        <ellipse cx="-19" cy="-15" rx="10" ry="3"/><ellipse cx="19" cy="-15" rx="10" ry="3"/>
        <ellipse cx="-19" cy="15" rx="10" ry="3"/><ellipse cx="19" cy="15" rx="10" ry="3"/>
      </g>
    </g>
    <rect x="146" y="60" width="60" height="52" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 6"/>
  </g>
  <!-- title -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="335" y="118" fill="#e5e7eb" font-size="58" font-weight="700">Passive Radar</text>
    <text x="335" y="172" fill="#22d3ee" font-size="38" font-weight="600">for Counter-Drone</text>
    <text x="337" y="222" fill="#9ca3af" font-size="22">Detects drones with the TV, 4G and 5G signals already in the air</text>
    <g font-size="18" font-weight="600">
      <rect x="337" y="242" width="96" height="32" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b"/>
      <text x="385" y="264" fill="#f59e0b" text-anchor="middle">DVB-T</text>
      <rect x="445" y="242" width="96" height="32" rx="16" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee"/>
      <text x="493" y="264" fill="#22d3ee" text-anchor="middle">4G LTE</text>
      <rect x="553" y="242" width="96" height="32" rx="16" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/>
      <text x="601" y="264" fill="#a78bfa" text-anchor="middle">5G NR</text>
      <rect x="661" y="242" width="196" height="32" rx="16" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444"/>
      <text x="759" y="264" fill="#ef4444" text-anchor="middle">micro-Doppler on FPGA</text>
    </g>
  </g>
</svg>
